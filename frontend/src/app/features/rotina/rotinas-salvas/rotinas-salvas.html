<div
  class="-mx-1 flex snap-x gap-3 overflow-x-auto px-1 pb-2"
  role="list"
  aria-label="Rotinas salvas"
>
  <div role="listitem" class="shrink-0 snap-start">
    <button
      type="button"
      class="card flex h-full w-40 flex-col items-start justify-between border-dashed text-slate-300 hover:border-brand-400/60 hover:text-white"
      [class.card--active]="!selectedId() && !loadingId()"
      [attr.aria-current]="!selectedId() ? 'true' : null"
      [disabled]="disabled()"
      (click)="novaRotina.emit()"
    >
      <span
        class="flex size-7 items-center justify-center rounded-md bg-brand-400/10 text-brand-300"
      >
        <ng-icon name="heroPlus" />
      </span>
      <span class="text-sm font-medium">Nova rotina</span>
    </button>
  </div>

  @if (loading() && !rotinas().length) {
    @for (placeholder of skeletons; track $index) {
      <div role="listitem" class="card w-56 shrink-0 cursor-default" aria-hidden="true">
        <div class="skeleton h-4 w-32"></div>
        <div class="skeleton mt-3 h-3 w-24"></div>
        <div class="skeleton mt-2 h-3 w-40"></div>
      </div>
    }
  }

  @for (rotina of rotinas(); track rotina.id) {
    <div role="listitem" class="shrink-0 snap-start">
      <button
        type="button"
        class="card h-full w-56 text-left"
        [class.card--active]="rotina.id === selectedId() || rotina.id === loadingId()"
        [attr.aria-current]="rotina.id === selectedId() ? 'true' : null"
        [disabled]="disabled()"
        (click)="selected.emit(rotina.id)"
      >
        <span class="block truncate font-medium text-white" [title]="rotina.nome">
          {{ rotina.nome }}
        </span>
        <span class="mt-1 block text-sm text-slate-400 tabular-nums">
          {{ rotina.totalExercicios }}
          {{ rotina.totalExercicios === 1 ? 'exercício' : 'exercícios' }} ·
          {{ rotina.diasComTreino }} {{ rotina.diasComTreino === 1 ? 'dia' : 'dias' }}
        </span>
        <span class="mt-2 block truncate text-xs text-slate-500">
          {{ rotina.grupos.length ? rotina.grupos.join(', ') : 'Sem exercícios ainda' }}
        </span>
      </button>
    </div>
  }

  @if (!loading() && !rotinas().length) {
    <p class="flex max-w-xs items-center text-sm leading-6 text-slate-500">
      Nenhuma rotina salva ainda. Dê um nome, monte a semana abaixo e clique em Salvar.
    </p>
  }
</div>
