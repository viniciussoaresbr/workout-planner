<section class="rounded-3xl border border-white/10 bg-slate-900/80 p-4">
  <header class="mb-4">
    <h3 class="text-lg font-bold text-white">{{ dia().nome }}</h3>
    <p class="text-xs tracking-[0.3em] text-slate-500 uppercase">
      {{ dia().itens.length }}/{{ maxItens }}
      {{ dia().itens.length === 1 ? 'exercício' : 'exercícios' }}
    </p>
  </header>

  <div
    cdkDropList
    [cdkDropListData]="dia().key"
    [cdkDropListEnterPredicate]="canEnter"
    class="min-h-48 space-y-3 rounded-2xl border border-dashed border-slate-700 bg-slate-950/40 p-3"
    [attr.aria-label]="'Exercícios de ' + dia().nome"
    (cdkDropListDropped)="dropped.emit($event)"
  >
    @for (item of dia().itens; track item.uid) {
      <article
        cdkDrag
        [cdkDragData]="item"
        class="cursor-grab rounded-2xl border border-white/10 bg-slate-900 px-4 py-3 active:cursor-grabbing"
      >
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="font-semibold text-white">{{ item.exercicio.nome }}</p>
            <p class="text-sm text-cyan-300">{{ item.exercicio.musculo }}</p>
          </div>
          <button
            type="button"
            class="flex items-center justify-center rounded-md border border-rose-400/30 bg-rose-400/10 p-1 text-lg text-rose-200 transition hover:bg-rose-400/20"
            [attr.aria-label]="'Remover ' + item.exercicio.nome + ' de ' + dia().nome"
            (click)="removed.emit(item.uid)"
          >
            <ng-icon name="heroTrash" />
          </button>
        </div>

        <div class="mt-4 grid grid-cols-2 gap-3">
          <label class="block">
            <span class="mb-2 block text-xs tracking-[0.25em] text-slate-500 uppercase">
              Séries
            </span>
            <input
              type="text"
              inputmode="numeric"
              autocomplete="off"
              [maxLength]="maxDigits"
              [value]="item.series ?? ''"
              [attr.aria-invalid]="isInvalid(item.series)"
              class="count-input"
              (input)="onCountInput(item, 'series', $event)"
            />
          </label>
          <label class="block">
            <span class="mb-2 block text-xs tracking-[0.25em] text-slate-500 uppercase">
              Reps
            </span>
            <input
              type="text"
              inputmode="numeric"
              autocomplete="off"
              [maxLength]="maxDigits"
              [value]="item.repeticoes ?? ''"
              [attr.aria-invalid]="isInvalid(item.repeticoes)"
              class="count-input"
              (input)="onCountInput(item, 'repeticoes', $event)"
            />
          </label>
        </div>
      </article>
    } @empty {
      <p class="py-8 text-center text-sm text-slate-500">Arraste exercícios para este dia.</p>
    }
  </div>
</section>
