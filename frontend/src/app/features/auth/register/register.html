<section
  class="flex min-h-screen items-center justify-center bg-[radial-gradient(circle_at_top_right,rgba(34,197,94,0.18),transparent_32%),linear-gradient(135deg,#020617,#111827_50%,#052e16)] px-6 py-10"
>
  <div
    class="w-full max-w-xl rounded-3xl border border-white/10 bg-slate-900/75 p-8 shadow-2xl shadow-emerald-950/30 backdrop-blur-sm sm:p-10"
  >
    <p class="text-sm tracking-[0.35em] text-emerald-300 uppercase">Novo acesso</p>
    <h1 class="mt-4 text-4xl font-black text-white">Crie sua conta</h1>
    <p class="mt-3 text-sm text-slate-400">O cadastro libera o acesso ao Workout Planner.</p>

    <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div>
        <label class="mb-2 block text-sm font-medium text-slate-200" for="register-name">
          Nome
        </label>
        <input
          id="register-name"
          type="text"
          autocomplete="name"
          formControlName="name"
          [class]="inputClasses"
          [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid"
          aria-describedby="register-name-error"
          placeholder="Seu nome"
        />
        <app-field-error [control]="form.controls.name" id="register-name-error" />
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-slate-200" for="register-email">
          E-mail
        </label>
        <input
          id="register-email"
          type="email"
          autocomplete="email"
          formControlName="email"
          [class]="inputClasses"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          aria-describedby="register-email-error"
          placeholder="voce@exemplo.com"
        />
        <app-field-error [control]="form.controls.email" id="register-email-error" />
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-slate-200" for="register-password">
          Senha
        </label>
        <input
          id="register-password"
          type="password"
          autocomplete="new-password"
          formControlName="password"
          [class]="inputClasses"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          aria-describedby="register-password-error"
          placeholder="Crie uma senha segura"
        />
        <app-field-error [control]="form.controls.password" id="register-password-error" />
      </div>

      <button
        type="submit"
        class="w-full rounded-2xl bg-emerald-400 px-4 py-3 font-semibold text-slate-950 transition hover:bg-emerald-300 disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Salvando...' : 'Cadastrar' }}
      </button>
    </form>

    <p class="mt-6 text-sm text-slate-400">
      Já possui conta?
      <a routerLink="/login" class="font-semibold text-emerald-300 hover:text-emerald-200">
        Fazer login
      </a>
    </p>
  </div>
</section>
