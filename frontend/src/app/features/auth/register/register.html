<app-auth-layout>
  <h2 class="text-2xl font-semibold tracking-tight text-white">Criar conta</h2>
  <p class="mt-2 text-sm text-slate-400">Leva menos de um minuto. Suas rotinas ficam salvas.</p>

  <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label class="field-label" for="register-name">Nome</label>
      <input
        id="register-name"
        type="text"
        autocomplete="name"
        formControlName="name"
        class="field"
        [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid"
        aria-describedby="register-name-error"
        placeholder="Como devemos te chamar"
      />
      <app-field-error [control]="form.controls.name" id="register-name-error" />
    </div>

    <div>
      <label class="field-label" for="register-email">E-mail</label>
      <input
        id="register-email"
        type="email"
        autocomplete="email"
        formControlName="email"
        class="field"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        aria-describedby="register-email-error"
        placeholder="voce@exemplo.com"
      />
      <app-field-error [control]="form.controls.email" id="register-email-error" />
    </div>

    <div>
      <label class="field-label" for="register-password">Senha</label>
      <input
        id="register-password"
        type="password"
        autocomplete="new-password"
        formControlName="password"
        class="field"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
        aria-describedby="register-password-error"
        placeholder="Mínimo de {{ limits.passwordMin }} caracteres"
      />
      <app-field-error [control]="form.controls.password" id="register-password-error" />
    </div>

    <button type="submit" class="btn btn-primary w-full py-3" [disabled]="submitting()">
      {{ submitting() ? 'Criando conta...' : 'Criar conta' }}
    </button>
  </form>

  <p class="mt-8 text-sm text-slate-400">
    Já tem conta?
    <a
      routerLink="/login"
      class="font-medium text-brand-300 underline-offset-4 hover:text-brand-200 hover:underline"
    >
      Entrar
    </a>
  </p>
</app-auth-layout>
