<app-auth-layout>
  <h2 class="text-2xl font-semibold tracking-tight text-white">Entrar</h2>
  <p class="mt-2 text-sm text-slate-400">Bem-vindo de volta. Acesse suas rotinas.</p>

  <form class="mt-8 space-y-2" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label class="field-label" for="login-email">E-mail</label>
      <input
        id="login-email"
        type="email"
        autocomplete="email"
        formControlName="email"
        class="field"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        aria-describedby="login-email-error"
        placeholder="voce@exemplo.com"
      />
      <app-field-error [control]="form.controls.email" id="login-email-error" />
    </div>

    <div>
      <label class="field-label" for="login-password">Senha</label>
      <div class="relative">
        <input
          #passwordInput
          id="login-password"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          class="field pr-11"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          aria-describedby="login-password-error"
          placeholder="Sua senha"
        />
        <app-password-toggle [input]="passwordInput" />
      </div>
      <app-field-error [control]="form.controls.password" id="login-password-error" />
    </div>

    <button type="submit" class="btn btn-primary mt-3 w-full py-3" [disabled]="submitting()">
      {{ submitting() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="mt-8 text-sm text-slate-400">
    Ainda não tem conta?
    <a
      routerLink="/register"
      class="font-medium text-brand-300 underline-offset-4 hover:text-brand-200 hover:underline"
    >
      Criar conta
    </a>
  </p>
</app-auth-layout>
